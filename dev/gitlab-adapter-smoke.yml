# Copy to .gitlab-ci.yml in the designated GitLab test project.
# Triggered by the adapter; ordinary pushes do not run this pipeline.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

adapter-metadata-check:
  image: alpine:3.22
  script:
    - ': "${ADAPTER_DELIVERY_ID:?}" "${ADAPTER_EVENT_ID:?}" "${ADAPTER_SOURCE_REVISION:?}" "${ADAPTER_SOURCE_BRANCH:?}"'
    - printf 'delivery=%s\nevent=%s\nrevision=%s\nbranch=%s\n' "$ADAPTER_DELIVERY_ID" "$ADAPTER_EVENT_ID" "$ADAPTER_SOURCE_REVISION" "$ADAPTER_SOURCE_BRANCH"
    - sleep 10
    - 'case "$ADAPTER_SOURCE_REVISION" in */commits/adapter-fail) exit 1 ;; esac'

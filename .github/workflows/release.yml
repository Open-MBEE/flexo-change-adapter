# Builds the release assets for a pushed v* tag: the packed tarball, an SPDX SBOM,
# a SHA-256 manifest and a GitHub artifact attestation for each asset (registry
# policy "release-integrity"). The tag must already exist on main (docs/releasing.md).
name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD || { echo "${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; only reviewed main commits are released"; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.16.0"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - name: Build assets
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm sbom --sbom-format spdx --omit dev > "dist/flexo-change-adapter-${GITHUB_REF_NAME}.spdx.json"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes ${pre}

name: Validate pinned Flexo model
run-name: Flexo validation ${{ inputs.work_id }}

on:
  workflow_dispatch:
    inputs:
      work_id:
        description: Stable validation work SHA-256
        required: true
        type: string
      input_commit:
        description: Immutable private snapshot record Git commit
        required: true
        type: string
      input_digest:
        description: SHA-256 of the delivered input bundle
        required: true
        type: string

permissions: {}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Reduces overlap; the persistent worker claim supplies actual deduplication.
    concurrency:
      group: flexo-validation-${{ inputs.work_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - name: Install locked TypeScript validator dependencies
        run: npm ci --omit=dev
      - name: Claim, validate and retain exact evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEXO_ENGINE_DIRECTORY: ${{ runner.temp }}/flexo-engines
          FLEXO_WORK_ID: ${{ inputs.work_id }}
          FLEXO_INPUT_COMMIT: ${{ inputs.input_commit }}
          FLEXO_INPUT_DIGEST: ${{ inputs.input_digest }}
        run: npm run github-job
